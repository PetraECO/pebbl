}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

.blob{display:inline-block;flex-shrink:0;background:var(--ac);border-radius:50% 50% 48% 52%/60% 55% 45% 40%}
.chip{background:var(--chip);border:1px solid var(--chipline);color:var(--ac2);font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:20px}
.body{flex:1;padding:0 24px 18px}
.disp{font-family:var(--display);font-style:italic;font-weight:400;letter-spacing:-.3px;margin:0;line-height:1.15}
.h1{font-size:29px}.h2{font-size:27px}
.sub{color:var(--sub);margin:0}
.lbl{color:var(--ft);font-size:10.5px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;margin:0 0 12px}
.btn{display:block;width:100%;background:var(--ac);color:var(--acx);border:0;border-radius:16px;padding:15px;text-align:center;font-weight:600;font-size:15.5px}
.btn:hover:not(:disabled){filter:brightness(1.07)}

.btn-sm{width:auto;padding:14px 52px;border-radius:14px;font-size:15px}

.seg{display:flex;gap:8px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}

.dgrid{display:flex;flex-direction:column;gap:8px}

.field{width:100%;background:var(--frame);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:16px}
textarea.field{min-height:66px;resize:none;background:var(--card);border-radius:12px;font-size:16px}
.num{width:62px;text-align:right;padding:7px 9px;border-radius:8px}
.nm{flex:1;min-width:0;padding:8px 10px;font-weight:500;border-radius:8px}
.fl{display:block;color:var(--ft);font-size:10.5px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;margin:16px 0 7px}
.pw{position:relative}
.pw .field{padding-right:62px}
.pw .link{position:absolute;right:4px;top:50%;transform:translateY(-50%)}
.err{color:var(--err);font-size:12.5px;margin:12px 0 0}
.alt{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;margin-top:14px}
.tiles{display:flex;gap:10px}
.tile{flex:1;background:none;border:1px solid var(--line);border-radius:14px;padding:6px;text-align:center;color:var(--sub);font-size:12px;font-weight:500}
.tile[aria-pressed="true"]{border:1.5px solid var(--ac);color:var(--tx)}
.tile span{display:block;padding:6px 0 2px}
.tile svg{display:block;width:100%;height:auto}
.nav{display:flex;gap:6px;padding:10px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border:0;border-radius:12px;background:transparent;color:var(--ft);font-weight:600;font-size:11.5px}
.nav button[aria-current="page"]{background:var(--chip);color:var(--tx)}
.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.scene{display:block;width:100%;max-width:300px;height:auto;margin:2px auto 14px}
.center{display:flex;flex-direction:column;align-items:center;text-align:center}
.note{color:var(--ft);font-size:11.5px;text-align:center;margin:9px 0 20px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--chip);border:1px solid var(--chipline);border-radius:12px;padding:8px 8px 8px 14px;margin:14px 24px 0;color:var(--sub);font-size:12px}
.banner button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11.5px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--frame);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:500;max-width:min(90vw,380px);text-align:center;z-index:20}
.saved{color:var(--ft);font-size:11.5px;text-align:center;min-height:18px;margin:2px 0 0}
.rip{transform-box:fill-box;transform-origin:center;animation:rip 4.2s ease-out infinite;fill:none;stroke:var(--ac2);stroke-width:1.5}
@keyframes rip{0%{transform:scale(.22);opacity:.65}100%{transform:scale(1);opacity:0}}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.fall{transform-box:fill-box;transform-origin:center;animation:fall .8s ease-in-out forwards}
@keyframes fall{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.rip{animation:none;opacity:.25;transform:none}.bob,.fall{animation:none}}
@media (max-width:480px){
  body{padding:0}
  .frame{border:0;border-radius:0;min-height:100vh;min-height:100dvh;width:100%}
  .hdr{padding:calc(20px + env(safe-area-inset-top,0px)) 20px 0}
  .body{padding-inline:20px}
  .banner{margin-inline:20px}
}
</style>

<script>
(function(){
'use strict';

/* ══ SUPABASE ══ */
var SUPABASE_URL='https://nqgawtyzynggdouanzrr.supabase.co';
var SUPABASE_KEY='sb_publishable_au3b9IbvnK7ECv2PJxGxMw_xGNJaTs8';
var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

/* ══ CONSTANTS ══ */
var DAY=86400000,CIRC=741.4;
var COLS=['var(--aw)','var(--as)','var(--acr)','var(--ac2)','var(--ac)','var(--sub)'];
var HEX=['#89a7c2','#9a93bd','#d9b27c'];
var DEFAULT_AREAS=[{name:'Work',color:HEX[0]},{name:'Personal',color:HEX[1]},{name:'Creative',color:HEX[2]}];
var DEFAULT_GOALS={Work:{weekly:8,monthly:32},Personal:{weekly:6,monthly:24},Creative:{weekly:3,monthly:12}};
var NUDGES=["Just the first pebble. That's all.","You don't have to feel ready to start.","Pick one thing. Just one.","Small start. Real progress.","The hardest step is showing up. You're already here.","Momentum starts with a single move."];
var KUDOS=["That's the hardest part done.","Consistency compounds.","One pebble closer.","Future you is grateful.","You showed up. That's the win."];
var P='M0,-26C16,-28 32,-14 30,2C28,20 10,28 -8,26C-26,24 -34,6 -30,-8C-26,-20 -14,-25 0,-26Z';

/* ══ STATE ══ */
var app=document.getElementById('app');
var U=null,loaded=false,offline=false,recovery=false,signingUp=false,entering=false,dataLoaded=false;
var S={name:'',areas:[],goals:{},appearance:null};
var sessions=[];
var loadErr='',limit=6,confirmKey=null,confirmClear=false,tab='focus',view='welcome',dur=25,showAll=false,dropping=false,busy=false,checkEmail='';
var run=null,celeb=null;
var soundOn=lsGet('pebbl.sound')!==false,lastSec=-1,audioCtx=null,saveT=null,toastT=null,savedT=null;

/* ══ HELPERS ══ */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function lsGet(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function sod(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function when(t){var k=Math.round((sod(Date.now())-sod(t))/DAY);return k<=0?'today':k===1?'yesterday':k+' days ago'}
function uk(name){return 'pebbl.'+name+'.'+(U?U.id:'anon')}
function toast(msg,ms){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},ms||3200)}
function effTheme(){var a=document.documentElement.getAttribute('data-theme');if(a==='dark'||a==='light')return a;return window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}
function applyAppearance(a){
  var r=document.documentElement;
  if(a==='dark'||a==='light')r.setAttribute('data-theme',a);else r.removeAttribute('data-theme');
  var m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content',effTheme()==='light'?'#f4f1eb':'#121314');
}
function aIdx(n){for(var i=0;i<S.areas.length;i++)if(S.areas[i].name===n)return i;return -1}
function col(n){var i=aIdx(n);return i<0?'var(--ac)':COLS[i%COLS.length]}
function areaLabel(n){return (!n||n==='Freeform')?'Free focus':n}
function goalOf(n){var g=S.goals[n];return Math.max(1,(g&&+g.weekly)||6)}

/* ══ DRAWING ══ */
function peb(x,y,s,f,o){return '<path d="'+P+'" transform="translate('+x+' '+y+') scale('+s+')" fill="'+f+'" opacity="'+(o||1)+'"/>'}
function rings(cx,cy,r,n){var o='';for(var i=0;i<n;i++)o+='<circle class="rip" cx="'+cx+'" cy="'+cy+'" r="'+r+'" style="animation-delay:-'+(i*4.2/n).toFixed(1)+'s"/>';return o}
function speck(){var d=[[40,20],[290,38],[70,110],[270,100],[120,10],[225,130],[20,70],[310,70]],o='';d.forEach(function(p){o+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="1.6" fill="var(--ac2)" opacity=".28"/>'});return o}
function blob(w,h,c){return '<span class="blob" style="width:'+w+'px;height:'+h+'px;'+(c?'background:'+c:'')+'"></span>'}
function pond(tap){
  return '<svg class="scene"'+(tap?' data-act="drop" style="cursor:pointer"':'')+' viewBox="0 0 332 150" role="img" aria-label="A pebble resting above still water"><title>A pebble resting above still water</title>'+speck()
    +'<circle cx="166" cy="75" r="36" fill="none" stroke="var(--ac2)" stroke-opacity=".16"/><circle cx="166" cy="75" r="60" fill="none" stroke="var(--ac2)" stroke-opacity=".10"/><circle cx="166" cy="75" r="84" fill="none" stroke="var(--ac2)" stroke-opacity=".06"/>'
    +rings(166,75,84,3)+'<g'+(tap?' id="pb"':'')+' class="bob">'+peb(170,81,.95,'var(--tx)',.08)+peb(166,75,.95,'var(--ac)')+peb(160,68,.4,'#ffffff',.14)+'</g></svg>';
}
function icon(t){
  var p=t==='focus'?'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.4"/>':t==='ripples'?'<path d="M3 8c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M3 13c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M3 18c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/>':'<circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/>';
  return '<svg viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>';
}

/* ══ STATS ══ */
function stats(){
  var now=Date.now(),cut=sod(now)-6*DAY,h={},n=0,tot=0,days={};
  S.areas.forEach(function(a){h[a.name]=0});
  sessions.forEach(function(e){
    var t=new Date(e.date).getTime();if(isNaN(t))return;
    days[sod(t)]=1;
    if(t>=cut){n++;tot+=e.hours;if(h[e.area]!==undefined)h[e.area]+=e.hours}
  });
  var s=0,d=sod(now);if(!days[d])d-=DAY;
  while(days[d]){s++;d-=DAY}
  return {h:h,n:n,tot:tot,streak:s};
}

/* ══ AUTH SCREENS ══ */

      +'<p class="sub" style="margin-bottom:28px">Pebbl is for the <span style="color:var(--ac)">first pebble</span> — that small, reluctant push when everything in you wants to wait.</p>'
      +'<button class="btn-out" data-act="view" data-v="signup">'+blob(14,11)+'Drop your first pebbl</button>'
      +'<button class="link" data-act="view" data-v="signin" style="margin-top:16px">I already have an account</button></div>';
  }else if(v==='signin'){
    b=form('signin','Welcome back.','Sign in to pick up where you left off.',
      field('siEmail','Email','email','email','you@example.com')+pwField('siPw','Password','current-password','Your password'),'Sign in',
      '<button type="button" class="link" data-act="view" data-v="forgot">Forgot your password?</button><button type="button" class="link" data-act="view" data-v="signup">Create an account</button>');
  }else if(v==='signup'){
    b=form('signup','Start here.','Make an account so your pebbles are saved.',
      field('suName','Your name','text','name','e.g. Petra')+field('suEmail','Email','email','email','you@example.com')+pwField('suPw','Password','new-password','At least 6 characters'),'Create account',
      '<button type="button" class="link" data-act="view" data-v="signin">I already have an account</button>');
  }else if(v==='forgot'){
    b=form('forgot','Reset your password.','Enter your email and we\'ll send you a reset link.',
      field('fpEmail','Email','email','email','you@example.com'),'Send reset link',
      '<button type="button" class="link" data-act="view" data-v="signin">Back to sign in</button>');
  }else if(v==='newpw'){
    b=form('newpw','Set a new password.','Choose something you\'ll remember.',
      pwField('npPw','New password','new-password','At least 6 characters'),'Update password','');
  }else if(v==='check'||v==='resetsent'){
    var sent=v==='check';
    b='<div class="center" style="padding-top:20px">'+pond(false)
      +'<h1 class="disp h1" style="margin-bottom:10px">Check your email.</h1>'
      +'<p class="sub" style="margin-bottom:18px">'+(sent?'We\'ve sent a confirmation link to ':'We\'ve sent a reset link to ')+'<b style="color:var(--tx);font-weight:500">'+esc(checkEmail)+'</b>.</p>'
      +'<p class="sub" style="margin-bottom:26px">'+(sent?'Click the link to confirm your account, then come back here and sign in.':'Click the link to reset your password, then come back and sign in.')+'</p>'
      +'<button class="btn btn-sm" data-act="view" data-v="signin">Go to sign in</button></div>';
  }

function applySettings(st){
  S.name=st.name||S.name||'';
  S.areas=(Array.isArray(st.areas)&&st.areas.length)?st.areas.map(function(a,i){return {name:String(a.name||('Area '+(i+1))),color:a.color||HEX[i%HEX.length]}}):DEFAULT_AREAS.map(function(a){return {name:a.name,color:a.color}});
  S.goals=st.goals&&typeof st.goals==='object'?st.goals:{};
  S.areas.forEach(function(a,i){if(!S.goals[a.name])S.goals[a.name]=DEFAULT_GOALS[a.name]||{weekly:6,monthly:24}});
  if(st.appearance==='dark'||st.appearance==='light')S.appearance=st.appearance;
}
function mapRow(r){return {id:r.id,area:r.area,task:r.task||'',hours:parseFloat(r.hours)||0,notes:r.notes||'',date:r.date,pomodoros:r.pomodoros||0}}
function cacheAll(){
  if(!U)return;
  lsSet(uk('cache'),{settings:{name:S.name,areas:S.areas,goals:S.goals,appearance:S.appearance},sessions:sessions.filter(function(s){return !s.pending}).slice(0,100)});
}
async function loadUserData(){
  loaded=false;offline=false;loadErr='';
  var sr=await sb.from('user_settings').select('*').eq('user_id',U.id).limit(1);
  var rr=await sb.from('sessions').select('*').eq('user_id',U.id).order('date',{ascending:false});
  var meta=(U.user_metadata&&U.user_metadata.name)||'';
  if(sr.error||rr.error){
    console.error('Load error',sr.error||rr.error);
    var le=sr.error?['user_settings',sr.error]:['sessions',rr.error];
    loadErr=le[0]+': '+(le[1].message||'error')+(le[1].code?' ('+le[1].code+')':'')+(le[1].status?' ['+le[1].status+']':'');
    var c=lsGet(uk('cache'));
    offline=true;
    if(c){applySettings(c.settings||{});sessions=(c.sessions||[]).slice()}
    else{applySettings({name:meta});sessions=[]}
  }else{
    var row=sr.data&&sr.data[0];
    if(row){applySettings(row)}
    else{applySettings({name:meta});S.appearance=S.appearance||lsGet('appearance')||'dark'}
    sessions=(rr.data||[]).map(mapRow);
    loaded=true;
    if(!row)scheduleSave();
    cacheAll();
  }
  var pend=lsGet(uk('pending'))||[];
  pend.slice().reverse().forEach(function(p){sessions.unshift(Object.assign({pending:true},p))});
  if(S.appearance){lsSet('appearance',S.appearance);applyAppearance(S.appearance)}
}
async function saveSettings(){
  if(!U)return false;
  if(!loaded){setSaved('Offline. Reconnect to save changes.');return false}
  var payload={name:S.name||'',areas:S.areas,goals:S.goals,appearance:S.appearance||'dark'};
  var ex=await sb.from('user_settings').select('user_id').eq('user_id',U.id).limit(1);
  var err;
  if(ex.data&&ex.data.length){err=(await sb.from('user_settings').update(payload).eq('user_id',U.id)).error}
  else{err=(await sb.from('user_settings').insert(Object.assign({user_id:U.id},payload))).error}
  if(err){console.error('saveSettings',err);setSaved('Couldn\'t save. Check your connection.');return false}
  cacheAll();setSaved('Saved');return true;
}
function scheduleSave(){clearTimeout(saveT);setSaved('Saving…');saveT=setTimeout(function(){saveT=null;saveSettings()},700)}
function flushSave(){if(saveT){clearTimeout(saveT);saveT=null;saveSettings()}}
function setSaved(t){var e=$('savedmsg');if(e)e.textContent=t;clearTimeout(savedT);if(t==='Saved')savedT=setTimeout(function(){var x=$('savedmsg');if(x)x.textContent=''},2200)}

async function flushPending(){
  if(!U)return;
  var pend=lsGet(uk('pending'))||[];
  if(!pend.length)return;
  var left=[];
  for(var i=0;i<pend.length;i++){
    var p=pend[i],row={user_id:U.id,area:p.area,task:p.task||'',hours:p.hours,notes:p.notes||'',date:p.date,pomodoros:p.pomodoros||0};
    var r=await sb.from('sessions').insert(row).select().single();
    if(r.error){left.push(p)}
    else{sessions.forEach(function(s){if(s.pending&&s.localId===p.localId){s.id=r.data.id;s.pending=false}})}
  }
  lsSet(uk('pending'),left);
  if(left.length<pend.length)cacheAll();
}

function initAudio(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function tone(f,t0,d,v){
  var o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='sine';o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.03);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.start(t0);o.stop(t0+d+.05);
}
function tick(){try{if(keepPlaying())return;if(soundOn&&audioCtx&&audioCtx.state==='running')tone(600,audioCtx.currentTime,.08,.08)}catch(e){}}
function chime(){
  try{if(!keepPlaying()&&soundOn&&audioCtx){initAudio();var t=audioCtx.currentTime;tone(523.25,t,.5,.2);tone(659.25,t+.18,.5,.2);tone(783.99,t+.36,.9,.2)}}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([120,60,120])}catch(e){}
}
var wl=null,keep=null,keepUrl=null;
function timerAudio(sec){
  var sr=8000,n=(sec+2)*sr,b=new Uint8Array(44+n),v=new DataView(b.buffer);
  function w(o,t){for(var i=0;i<t.length;i++)b[o+i]=t.charCodeAt(i)}
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
  b.fill(128,44);
  function add(at,f,d,a,k){
    var o=44+Math.round(at*sr),m=Math.round(d*sr);
    for(var i=0;i<m&&o+i<b.length;i++){var t=i/sr,x=b[o+i]-128+a*127*Math.exp(-t*k)*Math.sin(6.2832*f*t);b[o+i]=Math.max(0,Math.min(255,Math.round(128+x)))}
  }
  if(soundOn){
    for(var k=1;k<sec;k++)add(k,600,.08,.3,20);
    add(sec,523.25,.5,.55,5);add(sec+.18,659.25,.5,.55,5);add(sec+.36,783.99,.9,.55,4);
  }
  if(keepUrl)URL.revokeObjectURL(keepUrl);
  keepUrl=URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
  return keepUrl;
}
function keepPlaying(){return !!(keep&&!keep.paused&&!keep.ended)}
function holdAwake(on,secs,keepAudio){
  try{
    if(on){
      if(navigator.wakeLock&&!wl&&!document.hidden){navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null})}).catch(function(){})}
      if(secs){
        if(!keep)keep=new Audio();
        keep.src=timerAudio(secs);keep.currentTime=0;
        var pr=keep.play();if(pr&&pr.catch)pr.catch(function(){});
        try{if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:'Focus session',artist:'Pebbl'});navigator.mediaSession.setActionHandler('pause',function(){if(run&&run.running)act('pause',{})});navigator.mediaSession.setActionHandler('play',function(){if(run&&!run.running)act('resume',{})})}}catch(e){}
      }
    }else{
      if(wl){wl.release();wl=null}
      if(keep&&!keepAudio)keep.pause();
    }
  }catch(e){}
}
function remaining(){if(!run)return 0;return run.running?Math.max(0,Math.ceil((run.endAt-Date.now())/1000)):run.remaining}
function saveRun(){if(run)lsSet(uk('run'),run);else lsDel(uk('run'))}

function finishRun(){

  celeb={area:run.area,mins:mins,full:full,note:'',k:Math.floor(Math.random()*KUDOS.length)};

  return '<div style="padding-top:24px"><h1 class="disp h2" style="margin-bottom:16px">Ripples</h1>'
    +'<div style="display:flex;gap:8px;margin-bottom:22px"><div class="stat"><b>'+st.tot.toFixed(1)+'h</b><small>LAST 7 DAYS</small></div><div class="stat"><b>'+st.n+'</b><small>PEBBLES</small></div><div class="stat"><b style="color:var(--ac2)">'+st.streak+'</b><small>DAY RIPPLE</small></div></div>'
    +'<p class="lbl">Your cairns · one stone per hour</p>'
    +'<div style="display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 12px 14px;margin-bottom:24px;align-items:flex-end">'+S.areas.map(function(a,i){return cairn(a,i,st.h[a.name]||0,goalOf(a.name))}).join('')+'</div>'
    +'<p class="lbl">Recent pebbles</p><div style="display:flex;flex-direction:column;gap:8px">'+rows+'</div>'+more+'</div>';
}
function tile(k,name,eff){
  return '<button class="tile pv-'+k+'" data-act="theme" data-t="'+k+'" aria-pressed="'+(eff===k)+'"><svg viewBox="0 0 120 70" aria-hidden="true"><rect width="120" height="70" rx="9" fill="var(--pf)"/><circle cx="60" cy="35" r="14" fill="none" stroke="var(--pa)" stroke-opacity=".35"/><circle cx="60" cy="35" r="26" fill="none" stroke="var(--pa)" stroke-opacity=".18"/>'+peb(60,35,.42,'var(--pa)')+'</svg><span>'+name+'</span></button>';
}
function youView(st){
  var eff=effTheme(),nm=(S.name||'').trim(),ini=((nm||(U&&U.email)||'P').charAt(0)||'P').toUpperCase();
  var rows=S.areas.map(function(a,i){
    return '<div style="display:flex;align-items:center;gap:10px">'+blob(13,10,COLS[i%COLS.length])+'<input class="field nm" value="'+esc(a.name)+'" maxlength="20" aria-label="Name of area '+(i+1)+'" data-aname="'+i+'" autocomplete="off"><input class="field num" type="number" inputmode="numeric" min="1" max="40" value="'+goalOf(a.name)+'" aria-label="Weekly goal in hours for '+esc(a.name)+'" data-gi="'+i+'"><span style="color:var(--ft);font-size:12px;white-space:nowrap">h / wk</span></div>';
  }).join('');
  return '<div style="padding-top:24px"><div style="display:flex;align-items:center;gap:16px;margin-bottom:20px"><svg viewBox="-40 -40 80 80" width="72" height="72" style="flex-shrink:0" role="img" aria-label="Your pebble">'+peb(0,0,1.25,'var(--ac)')+'<text x="0" y="8" text-anchor="middle" font-size="24" font-weight="600" fill="var(--acx)">'+esc(ini)+'</text></svg><div style="min-width:0"><div class="disp h2" style="overflow:hidden;text-overflow:ellipsis">'+esc(nm||'You')+'</div><div class="sub" style="font-size:12.5px">'+(st.streak?st.streak+'-day ripple · ':'')+st.n+' pebbles in 7 days</div></div></div>'
    +'<div class="card"><p class="lbl"><label for="nm">Name</label></p><input id="nm" class="field" value="'+esc(S.name)+'" maxlength="40" placeholder="Your name" autocomplete="off"></div>'
    +'<div class="card"><p class="lbl">Appearance</p><div class="tiles">'+tile('dark','River',eff)+tile('light','Paper',eff)+'</div></div>'
    +'<div class="card"><p class="lbl">Sound</p><div class="seg"><button data-act="sound" aria-pressed="'+soundOn+'">Tick &amp; chime: '+(soundOn?'On':'Off')+'</button></div></div>'
    +'<div class="card"><p class="lbl">Your areas</p><div style="display:flex;flex-direction:column;gap:10px">'+rows+'</div><p style="color:var(--ft);font-size:11px;margin:12px 0 0">Call them anything. Past pebbles follow the new name when you leave the field.</p></div>'
    +'<p class="saved" id="savedmsg" role="status"></p>'
    +'<div class="card"><p class="lbl">Share Pebbl</p><p class="sub" style="font-size:12.5px;margin-bottom:12px">Know someone who stalls before they start?</p><button class="ghost" data-act="share" style="padding:11px 28px">Share Pebbl</button></div>'
    +'<div class="card"><p class="lbl">Your data</p><div class="dgrid"><div class="seg"><button data-act="dljson">Download JSON</button><button data-act="dlcsv">Download CSV</button></div><button class="ghost" data-act="clearall" style="padding:11px 20px;'+(confirmClear?'border-color:var(--err);color:var(--err)':'')+'">'+(confirmClear?'Tap again to delete all '+sessions.length+' pebbles':'Delete all pebbles')+'</button></div><p style="color:var(--ft);font-size:11px;margin:12px 0 0">Downloads include your name, areas, goals and every pebble. Deleting pebbles can\'t be undone.</p></div>'
    +'<div class="card" style="margin-top:6px"><p class="lbl">Account</p><p class="sub" style="margin-bottom:12px;overflow-wrap:anywhere">'+esc(U?U.email:'')+'</p><button class="ghost" data-act="signout" style="padding:11px 28px">Sign out</button></div></div>';
}
function navHTML(){
  return '<nav class="nav" aria-label="Sections">'+[['focus','Focus'],['ripples','Ripples'],['you','You']].map(function(x){return '<button data-act="tab" data-t="'+x[0]+'"'+(tab===x[0]?' aria-current="page"':'')+'>'+icon(x[0])+x[1]+'</button>'}).join('')+'</nav>';
}
function render(){
  if(!U||recovery){app.innerHTML=authHTML();return}
  var st=stats();
  app.innerHTML=header(st)+(offline?banner():'')+'<main class="body">'+(tab==='focus'?focusView(st):tab==='ripples'?ripplesView(st):youView(st))+'</main>'+navHTML();
  if(tab==='focus'&&run)tickUI();
}

/* ══ ACTIONS ══ */
var SHARE={title:'Pebbl',text:'Pebbl is a focus app for the first five ugly minutes, when you\'d rather do anything else. Drop your first pebbl.',url:'https://app.usepebbl.app'};
async function shareApp(){
  try{
    if(navigator.share){await navigator.share(SHARE);return}
  }catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(SHARE.text+' '+SHARE.url);toast('Link copied. Paste it anywhere.')}
  catch(e){toast(SHARE.url,6000)}
}
function rk(e){return String(e.id!=null?e.id:e.localId)}
async function delRow(k){
  if(confirmKey!==k){confirmKey=k;render();setTimeout(function(){if(confirmKey===k){confirmKey=null;render()}},4000);return}
  confirmKey=null;
  var i=-1;for(var j=0;j<sessions.length;j++)if(rk(sessions[j])===k){i=j;break}
  if(i<0){render();return}
  var e=sessions[i];
  if(e.pending){
    var pend=(lsGet(uk('pending'))||[]).filter(function(p){return p.localId!==e.localId});lsSet(uk('pending'),pend);
  }else{
    var r=await sb.from('sessions').delete().eq('id',e.id).eq('user_id',U.id);
    if(r.error){console.error(r.error);toast('Couldn\'t delete that one. '+(r.error.message||''),4500);render();return}
  }
  sessions.splice(i,1);cacheAll();render();
}
async function clearAll(){
  if(!confirmClear){confirmClear=true;render();setTimeout(function(){if(confirmClear){confirmClear=false;render()}},5000);return}
  confirmClear=false;
  var r=await sb.from('sessions').delete().eq('user_id',U.id);
  if(r.error){console.error(r.error);toast('Couldn\'t delete. '+(r.error.message||''),4500);render();return}
  lsSet(uk('pending'),[]);sessions=[];limit=6;cacheAll();toast('All pebbles deleted.');render();
}
function exportData(kind){
  var rows=sessions.map(function(e){return {date:e.date,area:areaLabel(e.area),minutes:Math.max(1,Math.round(e.hours*60)),hours:e.hours,notes:e.notes||'',task:e.task||'',completed_full_timer:!!e.pomodoros}});
  var out,type,ext;
  if(kind==='json'){
    out=JSON.stringify({exported_at:new Date().toISOString(),email:U.email,name:S.name,areas:S.areas,weekly_goals:S.goals,appearance:S.appearance,sessions:rows},null,2);type='application/json';ext='json';
  }else{
    var head=['date','area','minutes','hours','notes','task','completed_full_timer'];
    var q=function(v){v=String(v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
    out=[head.join(',')].concat(rows.map(function(r){return head.map(function(h){return q(r[h])}).join(',')})).join('\r\n');type='text/csv';ext='csv';
  }
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:type+';charset=utf-8'}));
  a.download='pebbl-data-'+new Date().toISOString().slice(0,10)+'.'+ext;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
}
async function renameArea(i,input){
  var old=S.areas[i].name,nn=input.value.trim();
  if(!nn||nn===old){input.value=old;return}
  var clash=S.areas.some(function(a,j){return j!==i&&a.name.toLowerCase()===nn.toLowerCase()});
  if(clash){input.value=old;toast('Each area needs its own name.');return}
  if(!loaded){input.value=old;toast('You\'re offline. Reconnect to rename.');return}
  setSaved('Saving…');
  var r=await sb.from('sessions').update({area:nn}).eq('user_id',U.id).eq('area',old);
  if(r.error){console.error(r.error);input.value=old;setSaved('Couldn\'t rename. Try again.');return}
  S.areas[i].name=nn;
  S.goals[nn]=S.goals[old]||{weekly:6,monthly:24};delete S.goals[old];
  sessions.forEach(function(s){if(s.area===old)s.area=nn});
  var pend=lsGet(uk('pending'));
  if(pend&&pend.length){pend.forEach(function(p){if(p.area===old)p.area=nn});lsSet(uk('pending'),pend)}
  if(run&&run.area===old){run.area=nn;saveRun()}
  if(celeb&&celeb.area===old){celeb.area=nn;saveCeleb()}
  await saveSettings();
}
function act(a,d,el){
  if(a==='tab'){tab=d.t;render()}
  else if(a==='view'){view=d.v;render()}
  else if(a==='showpw'){var i=$(d.for);if(i){var show=i.type==='password';i.type=show?'text':'password';el.textContent=show?'Hide':'Show'}}
  else if(a==='dur'){dur=parseInt(d.m,10);lsSet('pebbl.dur',dur);render()}
  else if(a==='area'){var ar=S.areas[parseInt(d.i,10)];if(ar)startRun(ar.name,dur)}
  else if(a==='drop'){
    if(dropping||run||celeb)return;dropping=true;initAudio();
    var b=$('pb');if(b)b.setAttribute('class','fall');
    setTimeout(function(){startRun('Freeform',5)},800);
  }
  else if(a==='pause'){run.remaining=remaining();run.running=false;saveRun();holdAwake(false);render()}
  else if(a==='resume'){run.endAt=Date.now()+run.remaining*1000;run.running=true;saveRun();holdAwake(true,run.remaining);render()}
  else if(a==='end'){finishRun()}
  else if(a==='done'){saveCelebration()}
  else if(a==='more'){limit+=20;render()}
  else if(a==='fewer'){limit=6;render()}
  else if(a==='delrow'){delRow(d.k)}
  else if(a==='clearall'){clearAll()}
  else if(a==='share'){shareApp()}
  else if(a==='dljson'){exportData('json')}
  else if(a==='dlcsv'){exportData('csv')}
  else if(a==='theme'){S.appearance=d.t;lsSet('appearance',d.t);applyAppearance(d.t);render();scheduleSave()}
  else if(a==='sound'){soundOn=!soundOn;lsSet('pebbl.sound',soundOn);if(soundOn){initAudio();tick()}if(run&&run.running)holdAwake(true,remaining());render()}
  else if(a==='retry'){retryLoad()}
  else if(a==='signout'){flushSave();sb.auth.signOut()}
}
async function retryLoad(){
  if(!U)return;
  await loadUserData();await flushPending();render();
  if(offline)toast('Still offline.');
}

/* ══ EVENTS ══ */
app.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b.dataset,b)});
app.addEventListener('submit',function(e){
  e.preventDefault();
  var f=e.target.dataset.form;
  if(f==='signin')signIn();else if(f==='signup')signUp();else if(f==='forgot')sendReset();else if(f==='newpw')setNewPw();
});
app.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='nm'){S.name=t.value;scheduleSave()}
  else if(t.dataset&&t.dataset.gi!==undefined){
    var ar=S.areas[parseInt(t.dataset.gi,10)];if(!ar)return;
    var v=Math.max(1,Math.min(40,parseInt(t.value,10)||1));
    var g=S.goals[ar.name]||{};
    S.goals[ar.name]={weekly:v,monthly:g.monthly||v*4};
    scheduleSave();
  }
  else if(t.id==='note'&&celeb){celeb.note=t.value;saveCeleb()}
});
app.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.aname!==undefined)renameArea(parseInt(t.dataset.aname,10),t);
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden)flushSave();
  else if(run&&run.running){if(keep&&!keepPlaying()&&remaining()>2)holdAwake(true,remaining());else holdAwake(true);if(remaining()<=0)finishRun();else tickUI()}
});
window.addEventListener('pagehide',flushSave);
document.addEventListener('pointerdown',initAudio);
window.addEventListener('online',function(){if(U&&(offline||(lsGet(uk('pending'))||[]).length))retryLoad()});

/* ══ START ══ */
async function init(){
  var hp=new URLSearchParams(location.hash.replace(/^#/,'')),sp=new URLSearchParams(location.search);
  if(hp.get('type')==='recovery'||sp.get('type')==='recovery')recovery=true;
  var ap=lsGet('appearance');if(ap==='dark'||ap==='light')applyAppearance(ap);else applyAppearance(null);
  var d=lsGet('pebbl.dur');if(d===15||d===25||d===45)dur=d;
  view=lsGet('pebbl_visited')?'signin':'welcome';
  lsSet('pebbl_visited',true);
  var r=await sb.auth.getSession(),session=r.data&&r.data.session;
  if(session&&!recovery){U=session.user;await enterApp()}
  else render();
  sb.auth.onAuthStateChange(function(ev,sess){
    if(ev==='PASSWORD_RECOVERY'){recovery=true;render()}
    else if(ev==='SIGNED_IN'&&sess){
      if(recovery||signingUp)return;
      U=sess.user;
      // Never await Supabase calls inside this callback: it deadlocks sign-in. Defer instead.
      if(!dataLoaded)setTimeout(function(){enterApp()},0);
    }
    else if(ev==='SIGNED_OUT'){resetState();view='signin';render()}
  });
}
init();

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})});
}
})();
</script>
